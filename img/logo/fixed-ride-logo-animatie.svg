<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 132 92" width="264" height="184" role="img" aria-label="Fixed Ride">
<style>
  svg { --lijn: #D4B97F; --vul: #0A120F; --gloed: #EAD7A9; }
  .s { fill: none; stroke: var(--lijn); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .v { fill: var(--vul); }
  .stip { fill: var(--lijn); }
  .deur { transform-box: view-box; transform-origin: 90px 74px; }
  .arm { transform-box: view-box; transform-origin: 47px 56px; }
  .boven { transform-box: view-box; transform-origin: 39px 82px; }
  .pet { transform-box: view-box; transform-origin: 46px 36px; }

  .gloed { opacity: 0; animation: gloed 1.2s ease 1.6s forwards; }
  .s { stroke-dasharray: 1; stroke-dashoffset: 1; animation: teken 1.3s cubic-bezier(.6,.1,.3,1) forwards; }
  .v { fill-opacity: 0; animation: vul .5s ease .9s forwards; }
  .stip { opacity: 0; animation: vul .3s ease 1.1s forwards; }
  .deur { animation: deur 1s cubic-bezier(.5,0,.2,1) 1.35s both; }
  .arm { animation: arm .8s cubic-bezier(.4,0,.2,1.3) 1.9s both; }
  .boven { animation: buig 1.1s ease-in-out 2.45s both; }
  .pet { animation: pet 1.1s ease-in-out 2.45s both; }
  @keyframes teken { to { stroke-dashoffset: 0; } }
  @keyframes vul { to { fill-opacity: 1; opacity: 1; } }
  @keyframes deur { from { transform: scaleX(1); } to { transform: scaleX(.52) skewY(-7deg); } }
  @keyframes gloed { to { opacity: 1; } }
  @keyframes arm { from { transform: rotate(30deg); } to { transform: rotate(-16deg); } }
  @keyframes buig { 0%, 100% { transform: none; } 45%, 60% { transform: rotate(6deg); } }
  @keyframes pet { 0%, 100% { transform: none; } 45%, 60% { transform: rotate(-14deg) translateY(-1px); } }
  @media (prefers-reduced-motion: reduce) {
    .s, .v, .stip, .gloed, .deur, .arm, .boven, .pet { animation: none; stroke-dashoffset: 0; fill-opacity: 1; opacity: 1; }
    .deur { transform: scaleX(.52) skewY(-7deg); } .arm { transform: rotate(-16deg); }
  }
</style>
